# HomeVision AI — napi automatikus árfrissítés
# Minden hajnalban lefuttatja az update-prices.mjs szkriptet, és ha változott
# az ár, be-commitolja a friss prices.json-t → a GitHub Pages újraépül.
name: Árak frissítése

on:
  schedule:
    - cron: '0 4 * * *'   # minden nap 04:00 UTC (magyar idő szerint 5-6 óra)
  workflow_dispatch:        # kézzel is indítható az Actions fülről

permissions:
  contents: write           # kell, hogy a robot commitolhasson

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Árak letöltése a boltokból
        run: node update-prices.mjs
      - name: Változások commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Automatikus árfrissítés ($(date -u +%F))"
          git push
